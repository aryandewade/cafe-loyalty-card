app = "atelier-cafe-loyalty"
primary_region = "bom" # Mumbai, India (ultra-low latency for café POS)

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[mounts]
  source = "atelier_data"
  destination = "/app/data"
