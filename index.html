<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <meta name="theme-color" content="#FBF9F5">
  <meta name="description" content="Atelier Specialty Coffee & Roastery — Digital Loyalty Club. Collect stamps across our roasteries in Mumbai, Bengaluru, Delhi, and Pune, unlock reserve single-estate harvests, and redeem member privileges.">
  <title>Atelier Café — Digital Loyalty Card & Member Pass</title>

  <!-- Typography: Cormorant Garamond, Plus Jakarta Sans, JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- Core Design System -->
  <link rel="stylesheet" href="css/design-system.css">
</head>
<body>
  <!-- High-End Atelier Coffee Preloader Cinema Screen -->
  <div id="atelier-preloader" class="atelier-preloader-root" aria-label="Loading Atelier Specialty Coffee">

    <!-- Skip Button in Corner -->
    <button type="button" id="preloader-skip-btn" class="preloader-skip-pill" aria-label="Skip Intro">
      <span>Skip &rarr;</span>
    </button>

    <!-- Ambient Floating Embers -->
    <div class="preloader-ambient-sparks" aria-hidden="true">
      <span class="spark s1">✦</span>
      <span class="spark s2">☕</span>
      <span class="spark s3">✦</span>
    </div>

    <!-- Center Stage -->
    <div class="preloader-stage">
      
      <!-- Steaming Espresso Cup & Pour Stream Graphic -->
      <div class="preloader-cup-wrap">
        <svg width="100" height="96" viewBox="0 0 100 96" fill="none" class="preloader-svg">
          <!-- Continuous Liquid Pour Stream -->
          <line x1="50" y1="0" x2="50" y2="46" stroke="url(#pour-stream-grad)" stroke-width="4.5" stroke-linecap="round" class="preloader-pour-stream"/>
          
          <!-- Rising Aromatic Steam Waves -->
          <path d="M42 22C42 25 39 27 39 30C39 33 42 35 42 38" stroke="#E6BE6B" stroke-width="2.2" stroke-linecap="round" class="preloader-steam steam-1"/>
          <path d="M50 16C50 20 47 23 47 27C47 31 50 34 50 38" stroke="#E6BE6B" stroke-width="2.5" stroke-linecap="round" class="preloader-steam steam-2"/>
          <path d="M58 22C58 25 55 27 55 30C55 33 58 35 58 38" stroke="#E6BE6B" stroke-width="2.2" stroke-linecap="round" class="preloader-steam steam-3"/>

          <!-- Golden Crema Fill (animates up inside cup) -->
          <clipPath id="cup-clip">
            <path d="M26 44H74C74 44 75 66 50 66C25 66 26 44 26 44Z"/>
          </clipPath>
          <g clip-path="url(#cup-clip)">
            <rect x="20" y="66" width="60" height="30" fill="url(#crema-grad)" class="preloader-crema-fill"/>
          </g>

          <!-- Cup Body Outline & Handle -->
          <path d="M26 44H74C74 44 75 66 50 66C25 66 26 44 26 44Z" stroke="#E6BE6B" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M74 48C80 48 84 51.5 84 56C84 60.5 80 64 74 64" stroke="#E6BE6B" stroke-width="3" stroke-linecap="round"/>
          <!-- Saucer -->
          <path d="M18 73H82" stroke="#E6BE6B" stroke-width="3.2" stroke-linecap="round"/>

          <!-- Gradients -->
          <defs>
            <linearGradient id="pour-stream-grad" x1="50" y1="0" x2="50" y2="46" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#C89D4B" stop-opacity="0.2"/>
              <stop offset="60%" stop-color="#E5BE6C"/>
              <stop offset="100%" stop-color="#FFEAA7"/>
            </linearGradient>
            <linearGradient id="crema-grad" x1="50" y1="66" x2="50" y2="44" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#8B572A"/>
              <stop offset="50%" stop-color="#C89D4B"/>
              <stop offset="100%" stop-color="#F5D77F"/>
            </linearGradient>
          </defs>
        </svg>

        <!-- Wax Stamp Impact Ring / Radial Shockwave -->
        <div class="preloader-stamp-shockwave"></div>
      </div>

      <!-- Typography -->
      <div class="preloader-copy">
        <div class="preloader-eyebrow">EST. 2024 &bull; ARTISANAL ROASTERS</div>
        <h1 class="preloader-title font-serif">ATELIER CAF&Eacute;</h1>
        <p class="preloader-subtitle">Crafting Daily Rituals &bull; Reserve Loyalty Club</p>
      </div>

      <!-- Luxury Hairline Gold Progress Bar -->
      <div class="preloader-progress-track">
        <div class="preloader-progress-fill"></div>
      </div>

    </div>
  </div>

  <!-- Ambient Interactive Background Canvas & Glow Aura -->
  <canvas id="ambient-canvas" class="ambient-canvas" aria-hidden="true"></canvas>
  <div id="ambient-glow" class="ambient-glow" aria-hidden="true"></div>

  <!-- Tactile Micro Film Grain Texture Overlay -->
  <div class="grain-overlay" aria-hidden="true"></div>

  <!-- Primary Application Mount -->
  <div id="app"></div>

  <!-- Global Persistent Modal Root -->
  <div id="modal-root"></div>

  <!-- Scripts in Structured Dependency Order -->
  <script src="js/audio.js"></script>
  <script src="js/qr.js"></script>
  <script src="js/confetti.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/security-adapter.js"></script>
  <script src="js/store.js"></script>
  <script src="js/components/ambient-bg.js"></script>
  <script src="js/components/candy-levels.js"></script>
  <script src="js/components/loyalty-card.js"></script>
  <script src="js/components/stamp-animator.js"></script>
  <script src="js/components/navbar.js"></script>
  <script src="js/components/datepicker.js"></script>
  <script src="js/components/modals.js"></script>
  <script src="js/components/preloader.js"></script>
  <script src="js/pages/landing.js"></script>
  <script src="js/pages/dashboard.js"></script>
  <script src="js/pages/rewards.js"></script>
  <script src="js/pages/activity.js"></script>
  <script src="js/pages/profile.js"></script>
  <script src="js/pages/staff.js"></script>
  <script src="js/pages/auth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
